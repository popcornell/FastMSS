# @package _global_
# CHiME-6-like: Kinect arrays around the room + binaural mics worn by a talker.
# One recording per device (<uuid>_<device>).
# python recipes/sim.py +multichannel=chime6 output_dir=... manifest_dir=...
defaults:
  - _common

spatial:
  devices:
    - {preset: kinect, name: kinect0}
    - {preset: kinect, name: kinect1}
    - {preset: binaural_worn}
  wearer: speaker
  n_wearer_seats: 2
  n_yaw: 8
  motion:
    head_turn_prob: 0.5
    head_jitter: 20.0
